version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bizflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-bizflow_erp_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizflow_admin} -d ${POSTGRES_DB:-bizflow_erp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizflow-network

  # -------------------------------------------------------------
  # Redis 7 In-Memory Cache & Message Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bizflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bizflow_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bizflow_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizflow-network

  # -------------------------------------------------------------
  # MinIO S3-Compatible Object Storage
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: bizflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bizflow_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bizflow_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bizflow-network

  # -------------------------------------------------------------
  # BizFlow Backend REST API (NestJS)
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bizflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bizflow_admin}:${POSTGRES_PASSWORD:-bizflow_secret_password}@postgres:5432/${POSTGRES_DB:-bizflow_erp_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bizflow_redis_secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_access_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_refresh_secret_change_in_production}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bizflow_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-bizflow_minio_secret}
      WEB_APP_URL: http://localhost:3002
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizflow-network

  # -------------------------------------------------------------
  # BizFlow Frontend Web Application (Next.js 15)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bizflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - bizflow-network

volumes:
  postgres_data:
    name: bizflow_postgres_data
  redis_data:
    name: bizflow_redis_data
  minio_data:
    name: bizflow_minio_data

networks:
  bizflow-network:
    name: bizflow-net
    driver: bridge
